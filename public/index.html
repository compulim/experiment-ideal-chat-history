<!doctype html>
<html lang="en">
  <head>
    <meta content="width=device-width" name="viewport" />
    <title>React web app</title>
    <link href="static/css/app.css" rel="stylesheet" type="text/css" />
    <style type="text/css">
      [data-testid='first button'] {
        display: block;
      }

      [data-testid='first button']:focus {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div>
      <button data-testid="first button" type="button">First button</button>
      <main></main>
      <footer>Press <kbd>ALT</kbd> + <kbd>A</kbd> to add a message.</footer>
    </div>
    <script src="static/js/app.js"></script>
  </body>
</html>
